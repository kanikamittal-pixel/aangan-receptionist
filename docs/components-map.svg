<rect x="191.0" y="194.25" width="228" height="59.0" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="2.2"/>
<text x="305.0" y="216.25" text-anchor="middle" font-size="12.5" fill="#222a3d">Opens the web call page and</text>
<text x="305.0" y="232.75" text-anchor="middle" font-size="12.5" fill="#222a3d">starts the call</text>
<rect x="449.0" y="186.0" width="228" height="75.5" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="2.2"/>
<text x="563.0" y="208.0" text-anchor="middle" font-size="12.5" fill="#222a3d">Speaks: what they need, area,</text>
<text x="563.0" y="224.5" text-anchor="middle" font-size="12.5" fill="#222a3d">size, timeline, name, phone,</text>
<text x="563.0" y="241.0" text-anchor="middle" font-size="12.5" fill="#222a3d">email and preferred time</text>
<rect x="1481.0" y="194.25" width="228" height="59.0" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="2.2"/>
<text x="1595.0" y="216.25" text-anchor="middle" font-size="12.5" fill="#222a3d">Gets answers and a booked</text>
<text x="1595.0" y="232.75" text-anchor="middle" font-size="12.5" fill="#222a3d">consultation during the call</text>
<rect x="1223.0" y="317.5" width="228" height="92.0" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2.2"/>
<text x="1337.0" y="339.5" text-anchor="middle" font-size="12.5" fill="#222a3d">Answers from the studio docs,</text>
<text x="1337.0" y="356.0" text-anchor="middle" font-size="12.5" fill="#222a3d">checks the 5 criteria,</text>
<text x="1337.0" y="372.5" text-anchor="middle" font-size="12.5" fill="#222a3d">confirms phone and email,</text>
<text x="1337.0" y="389.0" text-anchor="middle" font-size="12.5" fill="#222a3d">never quotes a price</text>
<rect x="1223.0" y="465.5" width="228" height="75.5" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2.2"/>
<text x="1337.0" y="487.5" text-anchor="middle" font-size="12.5" fill="#222a3d">Books the caller&#x27;s chosen slot</text>
<text x="1337.0" y="504.0" text-anchor="middle" font-size="12.5" fill="#222a3d">on the designer&#x27;s calendar,</text>
<text x="1337.0" y="520.5" text-anchor="middle" font-size="12.5" fill="#222a3d">during the call</text>
<rect x="1481.0" y="473.75" width="228" height="59.0" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2.2"/>
<text x="1595.0" y="495.75" text-anchor="middle" font-size="12.5" fill="#222a3d">Meeting and video link</text>
<text x="1595.0" y="512.25" text-anchor="middle" font-size="12.5" fill="#222a3d">created; the system is told</text>
<rect x="707.0" y="613.5" width="228" height="75.5" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2.2"/>
<text x="821.0" y="635.5" text-anchor="middle" font-size="12.5" fill="#222a3d">Studio docs and rules:</text>
<text x="821.0" y="652.0" text-anchor="middle" font-size="12.5" fill="#222a3d">services, 5 criteria, pricing</text>
<text x="821.0" y="668.5" text-anchor="middle" font-size="12.5" fill="#222a3d">rule (no figures)</text>
<rect x="965.0" y="613.5" width="228" height="75.5" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2.2"/>
<text x="1079.0" y="635.5" text-anchor="middle" font-size="12.5" fill="#222a3d">Vaani turns speech into text;</text>
<text x="1079.0" y="652.0" text-anchor="middle" font-size="12.5" fill="#222a3d">when the call ends it sends</text>
<text x="1079.0" y="668.5" text-anchor="middle" font-size="12.5" fill="#222a3d">the transcript and recording</text>
<rect x="1481.0" y="597.0" width="228" height="108.5" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2.2"/>
<text x="1595.0" y="619.0" text-anchor="middle" font-size="12.5" fill="#222a3d">Hard checks in code (area,</text>
<text x="1595.0" y="635.5" text-anchor="middle" font-size="12.5" fill="#222a3d">project type, size, deadline),</text>
<text x="1595.0" y="652.0" text-anchor="middle" font-size="12.5" fill="#222a3d">routes the lead, logs the</text>
<text x="1595.0" y="668.5" text-anchor="middle" font-size="12.5" fill="#222a3d">call, recording and cost in</text>
<text x="1595.0" y="685.0" text-anchor="middle" font-size="12.5" fill="#222a3d">Neon</text>
<rect x="1223.0" y="761.5" width="228" height="92.0" rx="10" fill="#fff" stroke="#db2777" stroke-width="2.2"/>
<text x="1337.0" y="783.5" text-anchor="middle" font-size="12.5" fill="#222a3d">Reads the transcript: lead</text>
<text x="1337.0" y="800.0" text-anchor="middle" font-size="12.5" fill="#222a3d">details, criteria results,</text>
<text x="1337.0" y="816.5" text-anchor="middle" font-size="12.5" fill="#222a3d">urgency and a short handoff</text>
<text x="1337.0" y="833.0" text-anchor="middle" font-size="12.5" fill="#222a3d">note</text>
<rect x="1481.0" y="909.5" width="228" height="92.0" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.2"/>
<text x="1595.0" y="931.5" text-anchor="middle" font-size="12.5" fill="#222a3d">Sends designers only what</text>
<text x="1595.0" y="948.0" text-anchor="middle" font-size="12.5" fill="#222a3d">needs action: new leads (Take</text>
<text x="1595.0" y="964.5" text-anchor="middle" font-size="12.5" fill="#222a3d">/ Pass), urgent leads, booked</text>
<text x="1595.0" y="981.0" text-anchor="middle" font-size="12.5" fill="#222a3d">meetings, complaints</text>
<rect x="1481.0" y="1057.5" width="228" height="92.0" rx="10" fill="#fff" stroke="#0891b2" stroke-width="2.2"/>
<text x="1595.0" y="1079.5" text-anchor="middle" font-size="12.5" fill="#222a3d">Shows every lead with its</text>
<text x="1595.0" y="1096.0" text-anchor="middle" font-size="12.5" fill="#222a3d">details, recording and</text>
<text x="1595.0" y="1112.5" text-anchor="middle" font-size="12.5" fill="#222a3d">transcript; the designer takes</text>
<text x="1595.0" y="1129.0" text-anchor="middle" font-size="12.5" fill="#222a3d">or passes</text>
<rect x="1481.0" y="1205.5" width="228" height="75.5" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2.2"/>
<text x="1595.0" y="1227.5" text-anchor="middle" font-size="12.5" fill="#222a3d">Designer contacts the customer</text>
<text x="1595.0" y="1244.0" text-anchor="middle" font-size="12.5" fill="#222a3d">or joins the booked meeting;</text>
<text x="1595.0" y="1260.5" text-anchor="middle" font-size="12.5" fill="#222a3d">complaints get a callback</text>
<rect x="1481.0" y="1337.0" width="228" height="92.0" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2.2"/>
<text x="1595.0" y="1359.0" text-anchor="middle" font-size="12.5" fill="#222a3d">Every lead sits in one sales</text>
<text x="1595.0" y="1375.5" text-anchor="middle" font-size="12.5" fill="#222a3d">pipeline by stage, with</text>
<text x="1595.0" y="1392.0" text-anchor="middle" font-size="12.5" fill="#222a3d">revenue and cost; a dashboard</text>
<text x="1595.0" y="1408.5" text-anchor="middle" font-size="12.5" fill="#222a3d">summarises it</text>
<text x="24" y="1501.0" font-size="14" fill="#3a4258"><tspan font-weight="800">Built with:</tspan> Claude Code · code on GitHub · hosted on Vercel · data in Neon</text>
